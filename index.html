<!DOCTYPE html>
<html>
<head>
  <title>My Chatbot</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: auto; padding: 10px; }
    #chat { margin-top: 15px; }
    .user { color: blue; }
    .bot { color: green; }
    input { width: 70%; padding: 8px; }
    button { padding: 8px; }
  </style>
</head>
<body>
  <h2>Mera Chatbot</h2>
  <input id="msg" placeholder="Message likho...">
  <button onclick="send()">Send</button>
  <div id="chat"></div>

  <script>
    async function send() {
      const input = document.getElementById('msg');
      const userMsg = input.value;
      if (!userMsg) return;
      document.getElementById('chat').innerHTML += `<p class="user"><b>Aap:</b> ${userMsg}</p>`;
      input.value = "";

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: userMsg })
        });
        const data = await res.json();
        if (data.reply) {
          document.getElementById('chat').innerHTML += `<p class="bot"><b>Bot:</b> ${data.reply}</p>`;
        } else {
          document.getElementById('chat').innerHTML += `<p class="bot"><b>Error:</b> ${JSON.stringify(data)}</p>`;
        }
      } catch (err) {
        document.getElementById('chat').innerHTML += `<p class="bot"><b>Error:</b> ${err.message}</p>`;
      }
    }
  </script>
</body>
</html>
